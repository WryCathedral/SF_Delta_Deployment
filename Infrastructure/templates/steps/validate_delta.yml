parameters:
  - name: alias
    type: string
steps:
- task: PowerShell@2
  displayName: 'Validate delta in the target Org'
  enabled: true
  inputs:
    targetType: filePath
    filePath: ./Infrastructure/scripts/validate_delta.ps1
    arguments: ${{ parameters.alias }}
- task: PublishPipelineArtifact@1
  displayName: "Publish Delta Package"
  inputs:
    targetPath: "artifacts"
    artifact: "Delta-Pacakge"
    publishLocation: "pipeline"