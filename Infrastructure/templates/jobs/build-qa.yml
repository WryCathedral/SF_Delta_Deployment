parameters:
  - name: client_id
    type: string
  - name: alias
    type: string
  - name: username
    type: string
  - name: sf_cli_version
    type: string
  - name: instance_url
    type: string
  - name: isdevhub
    type: string

jobs:
  ## Validation and Deployment to QA sandbox
  - job: build_qa
    displayName: Validate and Deploy to QA sandbox
    timeoutInMinutes: 200
    steps:

      ## Install Salesforce CLI
      - template: "../steps/install_sf_cli.yml"
        parameters:
          sf_cli_version: ${{ parameters.sf_cli_version }}

      ## Install Git Delta Plugin
      - template: "../steps/install_sfdx_git_delta_plugin.yml"

      ## Get the JWT from the library and copy from Temp Directory to Source Directory
      - template: "../steps/get_jwt.yml"

      ## Start validation when below condition is met
      - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:

          ## Install Salesforce CLI Scanner
          - template: "../steps/install_sf_code_analyzer.yml"

          ## Run Salesforce Code Analyzer
          - template: "../steps/run_sf_code_analyzer_on_delta.yml"

          # ## Authorize Deployment User with QA sandbox for validation
          - template: "../steps/authorize_qa_org.yml"
            parameters:
              alias: ${{ parameters.alias }}
              client_id: ${{ parameters.client_id }}
              username: ${{ parameters.username }}
              instance_url: ${{ parameters.instance_url }}
              isdevhub: ${{ parameters.isdevhub }}

              
          ## Start validation for delta changes in the QA sandbox
          - template: "../steps/validate_delta.yml"
            parameters:
              alias: ${{ parameters.alias }}
              
              
      ## Authorize Deployment User with QA sandbox for deployment 
      - ${{ if eq(variables['Build.SourceBranchName'], 'develop') }}:
          - template: "../steps/authorize_qa_org.yml"
            parameters:
              alias: ${{ parameters.alias }}
              client_id: ${{ parameters.client_id }}
              username: ${{ parameters.username }}
              instance_url: ${{ parameters.instance_url }}
              isdevhub: ${{ parameters.isdevhub }}

          
          ## Deploy the delta in the Pull Request to QA sandbox
          - template: "../steps/deploy_delta.yml"
            parameters:
              alias: ${{ parameters.alias }}
          

   