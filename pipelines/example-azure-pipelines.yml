# Example: PR validation + post-merge deploy.
# The task downloads the secure file, fetches history when the checkout is shallow,
# and publishes artifacts even when validation or Code Analyzer fails.
# Stages and jobs stay in this pipeline. A task cannot add them.

trigger:
  branches:
    include:
      - develop

pr:
  branches:
    include:
      - develop

variables:
  - group: QA-Org

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: SfOrgValidateDeploy@1
    displayName: Salesforce Org Validate & Deploy (Delta)
    inputs:
      operationMode: auto
      alias: $(alias)
      authMethod: jwt
      orgType: sandbox
      client_id: $(client_id)
      username: $(username)
      jwtKeySecureFile: your-jwt-private-key.pem
      targetBranch: develop
      validateTestLevel: NoTestRun
      deployTestLevel: NoTestRun
      deployWaitTime: '120'
      ignoreWarnings: false
      ignoreConflicts: true
      runCodeAnalyzer: false
      useCustomPmdRuleset: false
      publishDeltaArtifact: true
      deltaArtifactName: $(Build.DefinitionName)-Delta-Package
      publishCodeAnalyzerArtifact: false
      codeAnalyzerArtifactName: $(Build.DefinitionName)-Code-Analyzer
